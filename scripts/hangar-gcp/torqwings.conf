# /etc/apache2/conf-available/torqwings.conf on torqwings-serv1
# Enable with: sudo a2enmod proxy proxy_http && sudo a2enconf torqwings && sudo systemctl reload apache2

# Bay 03 design files (read by Vercel's /api/hangar/vehicle-design-files)
Alias /torqwings/bay3 /home/torqwings/Bay3
<Directory /home/torqwings/Bay3>
    Options -Indexes
    AllowOverride None
    Require all granted
    # Belt and braces: never serve code or secrets from anywhere under Bay3.
    <FilesMatch "\.(py|pyc|env|sh|service)$">
        Require all denied
    </FilesMatch>
</Directory>
# The shared Vehicle Design script and its helpers -- nothing in here is served.
<Directory /home/torqwings/Bay3/VehicleDesigner>
    Require all denied
</Directory>
AddType application/json .json
AddType text/markdown .md

# Hangar runner (hangar_runner.py on 127.0.0.1:8001) -- runs VehicleDesign.py
# for Vercel's /api/hangar/vehicle-design/run. The runner checks X-Hangar-Key.
ProxyPass        /torqwings/api/ http://127.0.0.1:8001/
ProxyPassReverse /torqwings/api/ http://127.0.0.1:8001/
ProxyTimeout 120
